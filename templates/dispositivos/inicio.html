{% extends "base.html" %}

{% block title %}Inicio | EcoEnergy{% endblock %}

{% block content %}
<div class="container py-5">
    <!-- Card Principal / Hero Container -->
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <!-- Banner Superior con Degradado -->
        <div class="p-4 p-md-5 text-white" style="background: linear-gradient(135deg, #0f5132 0%, #198754 60%, #20c997 100%);">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="d-inline-flex align-items-center gap-2 bg-white rounded-pill px-3 py-1 mb-3 text-dark border border-secondary border-opacity-25 small shadow-sm">
                        <i class="bi bi-tree-fill text-success"></i>
                        <span class="fw-medium">Energía Sustentable</span>
                    </div>
                    <h1 class="display-5 fw-bold mb-3">{{ sistema }}</h1>
                    <p class="lead text-white-50 mb-0 fs-5">
                        {{ mensaje }}
                    </p>
                </div>
                <div class="col-md-4 text-center text-md-end mt-4 mt-md-0 d-none d-md-block">
                    <i class="bi bi-lightning-charge-fill display-1 text-white opacity-25"></i>
                </div>
            </div>
        </div>

        <!-- Cuerpo de la Tarjeta con Información del Curso -->
        <div class="card-body p-4 p-md-5 bg-white">
            <div class="row g-4 align-items-center">
                <div class="col-md-8">
                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-success bg-opacity-10 text-success p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                            <i class="bi bi-journal-bookmark-fill fs-4"></i>
                        </div>
                        <div>
                            <span class="text-muted small text-uppercase fw-bold tracking-wide">Información del Proyecto</span>
                            <h5 class="mb-0 text-dark fw-semibold">Curso: <span class="text-success">{{ asignatura }}</span></h5>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 text-md-end">
                    <a href="{% url 'dispositivos:catalogo' %}" class="btn btn-success btn-lg rounded-pill px-4 shadow-sm fw-medium d-inline-flex align-items-center gap-2">
                        <i class="bi bi-grid-fill"></i> Ver Dispositivos
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
